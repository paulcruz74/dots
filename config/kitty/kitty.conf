########################################
# Catppuccin Mocha (embedded)
########################################

foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #1E1E2E

url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825

color0  #45475A
color8  #585B70

color1  #F38BA8
color9  #F38BA8

color2  #A6E3A1
color10 #A6E3A1

color3  #F9E2AF
color11 #F9E2AF

color4  #89B4FA
color12 #89B4FA

color5  #F5C2E7
color13 #F5C2E7

color6  #94E2D5
color14 #94E2D5

color7  #BAC2DE
color15 #A6ADC8

########################################
# Bell / Attention
########################################

enable_audio_bell no
visual_bell_duration 0.2
window_alert_on_bell yes

########################################
# Font
########################################
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
modify_font cell_width -1

########################################
# Use true split-tree layout (tmux-like)
########################################

enabled_layouts splits

########################################
# Splits (tmux-style)
########################################

# Vertical split (like tmux % → side-by-side)
map ctrl+b>shift+5 launch --cwd=current --location=vsplit

# Horizontal split (like tmux " → stacked)
map ctrl+b>shift+' launch --cwd=current --location=hsplit

########################################
# Navigation between panes
########################################

map ctrl+b>h neighboring_window left
map ctrl+b>j neighboring_window down
map ctrl+b>k neighboring_window up
map ctrl+b>l neighboring_window right

########################################
# Remove macOS Title Bar
########################################

hide_window_decorations titlebar-and-corners

########################################
# Background Opacity
########################################
background_opacity 0.85
background_blur 20
inactive_text_alpha 0.6

########################################
# Window Border (visual padding)
########################################
# Padding acts as a visible border with background opacity
window_padding_width 4
